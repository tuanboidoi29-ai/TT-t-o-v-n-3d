name: Check Free Ruby Compatibility and Manifest

on:
  push:
    branches: [main]
    paths:
      - 'tran_tuan_noi_that_free/**'
      - '.github/workflows/check-free-ruby.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruby-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7.8', '3.2']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Syntax check all packaged Ruby files
        shell: bash
        run: |
          set -euo pipefail
          find tran_tuan_noi_that_free/files -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - name: Verify manifest, SHA256, versions and runtime module list
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'json'
          require 'digest'
          root = 'tran_tuan_noi_that_free'
          manifest = JSON.parse(File.binread(File.join(root, 'update_latest.json')))
          version = manifest.fetch('version').to_s
          raise 'Invalid version' unless version.match?(/^[0-9]+\.[0-9]+\.[0-9]+$/)
          raise 'Edition mismatch' unless manifest['edition'] == 'no_license' && manifest['license_required'] == false
          files = manifest.fetch('files')
          raise 'Empty manifest' unless files.is_a?(Array) && !files.empty?
          entries = {}
          files.each do |item|
            path = item.fetch('path')
            raise "Duplicate manifest path: #{path}" if entries.key?(path)
            entries[path] = item
            raise "Unsafe path: #{path}" if path.start_with?('/') || path.split('/').include?('..')
            source = File.join(root, 'files', path)
            raise "Missing source: #{path}" unless File.file?(source)
            actual = Digest::SHA256.file(source).hexdigest
            raise "SHA mismatch: #{path}" unless actual == item.fetch('sha256')
            expected = "https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/#{root}/files/#{path}"
            raise "URL mismatch: #{path}" unless item.fetch('url') == expected
          end
          bootstrap = File.read(File.join(root, 'files/tran_tuan_noi_that/bootstrap.rb'))
          entry = File.read(File.join(root, 'files/TranTuanNoiThat.rb'))
          raise 'Bootstrap version mismatch' unless bootstrap.include?("VERSION = '#{version}'")
          raise 'Extension version mismatch' unless entry.include?("ext.version = '#{version}'")
          marker = "      %w[\n        board_tool"
          start = bootstrap.index(marker)
          finish = bootstrap.index("      ].each do |stem|", start || 0)
          raise 'Cannot read runtime module list' unless start && finish
          body = bootstrap[(start + marker.length)...finish]
          stems = ['board_tool'] + body.lines.map(&:strip).select { |line| line.match?(/\A[a-z0-9_]+\z/) }
          raise 'Duplicate runtime module entry' unless stems.uniq.length == stems.length
          stems.each do |stem|
            raise "Runtime module missing: #{stem}" unless entries.key?("tran_tuan_noi_that/#{stem}.rb")
          end
          %w[TranTuanNoiThat.rb TT_TranTuan_UpdateLoader.rb tran_tuan_noi_that/bootstrap.rb tran_tuan_noi_that/settings.rb tran_tuan_noi_that/updater.rb].each do |required|
            raise "Required file missing: #{required}" unless entries.key?(required)
          end
          puts "FREE #{version}: #{files.length} files; #{stems.length} runtime modules; SHA256/URLs/versions OK"
          RUBY
