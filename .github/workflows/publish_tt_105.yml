# TT automatic release builder
name: Publish TT 1.0.5 RBZ
on:
  push:
jobs:
  publish:
    if: github.event.head_commit.message != 'Publish TT 1.0.5 Drawer RBZ'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build clean RBZ and design icons
        shell: bash
        run: |
          set -e
          rm -rf release_build
          mkdir -p release_build/TT_TaoVan/icons
          cp release_1.0.5/tt_tao_van.rb release_build/tt_tao_van.rb
          cp release_1.0.5/TT_TaoVan/main.rb release_build/TT_TaoVan/main.rb
          cp release_1.0.5/TT_TaoVan/update.rb release_build/TT_TaoVan/update.rb
          cp release_1.0.5/TT_TaoVan/drawer.rb release_build/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/version.txt release_build/TT_TaoVan/version.txt
          cp release_1.0.5/TT_TaoVan/core.rb release_build/TT_TaoVan/core.rb
          cp release_1.0.5/TT_TaoVan/box.rb release_build/TT_TaoVan/box.rb
          make_icon() {
            label="$1"; out="$2"; size="$3"
            cat > /tmp/icon.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="5" fill="#e6e6e6" stroke="#333" stroke-width="2"/><rect x="7" y="8" width="18" height="16" rx="2" fill="#a8a8a8" stroke="#555" stroke-width="2"/><text x="16" y="20" text-anchor="middle" font-family="DejaVu Sans" font-size="10" font-weight="bold" fill="#ff8000">$label</text></svg>
          SVG
            convert /tmp/icon.svg -resize "${size}x${size}" "$out"
          }
          make_icon V release_build/TT_TaoVan/icons/tao_van_16.png 16
          make_icon V release_build/TT_TaoVan/icons/tao_van_32.png 32
          make_icon B release_build/TT_TaoVan/icons/tao_box_16.png 16
          make_icon B release_build/TT_TaoVan/icons/tao_box_32.png 32
          make_icon K release_build/TT_TaoVan/icons/tao_ngan_keo_16.png 16
          make_icon K release_build/TT_TaoVan/icons/tao_ngan_keo_32.png 32
          make_icon X release_build/TT_TaoVan/icons/xuat_chi_tiet_16.png 16
          make_icon X release_build/TT_TaoVan/icons/xuat_chi_tiet_32.png 32
          make_icon U release_build/TT_TaoVan/icons/cap_nhat_16.png 16
          make_icon U release_build/TT_TaoVan/icons/cap_nhat_32.png 32
          ruby -c release_build/tt_tao_van.rb
          for f in release_build/TT_TaoVan/*.rb; do ruby -c "$f"; done
          (cd release_build && zip -qr ../TT_TaoVan_1.0.5_TaoNganKeo.rbz .)
          unzip -t TT_TaoVan_1.0.5_TaoNganKeo.rbz
          sha256sum TT_TaoVan_1.0.5_TaoNganKeo.rbz | tee release_sha.txt
      - name: Update manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          sha=pathlib.Path('release_sha.txt').read_text().split()[0]
          p=pathlib.Path('update.json'); data=json.loads(p.read_text())
          data['version']='1.0.5'
          data['rbz_url']='https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.0.5_TaoNganKeo.rbz'
          data['sha256']=sha
          data['notes']='Vision 1.0.5 - Tạo Ngăn Kéo tùy chỉnh; Menu + Toolbar + Icon riêng; giữ Tạo Ván, Tạo Box, Xuất chi tiết ván; Hot Update không cần cài RBZ thủ công.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TT_TaoVan_1.0.5_TaoNganKeo.rbz update.json
          git commit -m "Publish TT 1.0.5 Drawer RBZ"
          git push
