name: Publish TT 1.0.5 RBZ
on:
  push:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and validate RBZ
        run: |
          base64 -d TT_TaoVan_1.0.5_TaoNganKeo_FINAL.rbz.b64 > TT_TaoVan_1.0.5_TaoNganKeo_FINAL.rbz
          unzip -t TT_TaoVan_1.0.5_TaoNganKeo_FINAL.rbz
          test "$(sha256sum TT_TaoVan_1.0.5_TaoNganKeo_FINAL.rbz | cut -d' ' -f1)" = "eb7da061e71b7bc8132ba1173de781eaa701cddaf94ca17442bfc9bbd4182332"
      - name: Publish RBZ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TT_TaoVan_1.0.5_TaoNganKeo_FINAL.rbz
          git commit -m "Publish TT 1.0.5 Drawer RBZ" || true
          git push
