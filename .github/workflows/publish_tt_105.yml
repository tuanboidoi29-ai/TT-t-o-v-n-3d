# TT manual release builder
name: Publish TT 1.0.5 RBZ
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build clean RBZ and design icons
        shell: bash
        run: |
          set -e
          rm -rf release_build
          mkdir -p release_build/TT_TaoVan/icons
          cp release_1.0.5/tt_tao_van.rb release_build/tt_tao_van.rb
          cp release_1.0.5/TT_TaoVan/main.rb release_build/TT_TaoVan/main.rb
          cp release_1.0.5/TT_TaoVan/update.rb release_build/TT_TaoVan/update.rb
          cp release_1.0.5/TT_TaoVan/drawer.rb release_build/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/version.txt release_build/TT_TaoVan/version.txt
          cp release_1.0.5/TT_TaoVan/core.rb release_build/TT_TaoVan/core.rb
          cp release_1.0.5/TT_TaoVan/box.rb release_build/TT_TaoVan/box.rb
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          out=Path('release_build/TT_TaoVan/icons')
          labels={'tao_van':'V','tao_box':'B','tao_ngan_keo':'K','xuat_chi_tiet':'X','cap_nhat':'U'}
          for name,label in labels.items():
            for size in (16,32):
              im=Image.new('RGBA',(size,size),(0,0,0,0)); d=ImageDraw.Draw(im); p=max(1,size//10)
              d.rounded_rectangle((p,p,size-p,size-p),radius=max(2,size//6),fill=(230,230,230,255),outline=(60,60,60,255),width=max(1,size//16))
              f=None
              try: f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf',11 if size==16 else 22)
              except: pass
              box=d.textbbox((0,0),label,font=f); tw=box[2]-box[0]; th=box[3]-box[1]
              d.text(((size-tw)/2,(size-th)/2-1),label,font=f,fill=(255,128,0,255))
              im.save(out/f'{name}_{size}.png')
          PY
          ruby -c release_build/tt_tao_van.rb
          for f in release_build/TT_TaoVan/*.rb; do ruby -c "$f"; done
          (cd release_build && zip -qr ../TT_TaoVan_1.0.5_TaoNganKeo.rbz .)
          unzip -t TT_TaoVan_1.0.5_TaoNganKeo.rbz
          sha256sum TT_TaoVan_1.0.5_TaoNganKeo.rbz | tee release_sha.txt
      - name: Update manifest
        run: |
          python3 - <<'PY'
          import json, pathlib
          sha=pathlib.Path('release_sha.txt').read_text().split()[0]
          p=pathlib.Path('update.json'); data=json.loads(p.read_text())
          data['version']='1.0.5'
          data['rbz_url']='https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.0.5_TaoNganKeo.rbz'
          data['sha256']=sha
          data['notes']='Vision 1.0.5 - Tạo Ngăn Kéo tùy chỉnh; CHẾ ĐỘ CHỜ; TAB chuyển Tự động 2 điểm / Thủ công; Preview 3D; Menu + Toolbar + Icon.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TT_TaoVan_1.0.5_TaoNganKeo.rbz update.json
          git commit -m "Publish TT 1.0.5 Drawer RBZ" || true
          git push
