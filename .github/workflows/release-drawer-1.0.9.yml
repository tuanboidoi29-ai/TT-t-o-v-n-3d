name: Release TT Tạo Ván 1.0.9 - Drawer

on:
  push:
    paths:
      - 'release_1.0.5/TT_TaoVan/drawer.rb'
      - 'release_1.0.5/TT_TaoVan/version.txt'
      - '.github/workflows/release-drawer-1.0.9.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RBZ 1.0.9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_tt
          mkdir -p build_tt/pkg
          curl -fsSL 'https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.0.8_TaoNganKeo.rbz' -o build_tt/base.rbz
          unzip -q build_tt/base.rbz -d build_tt/pkg
          test -f build_tt/pkg/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/drawer.rb build_tt/pkg/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/version.txt build_tt/pkg/TT_TaoVan/version.txt
          ruby -c build_tt/pkg/TT_TaoVan/drawer.rb
          rm -f TT_TaoVan_1.0.9_TaoNganKeo.rbz
          (cd build_tt/pkg && zip -qr ../../TT_TaoVan_1.0.9_TaoNganKeo.rbz .)
          unzip -t TT_TaoVan_1.0.9_TaoNganKeo.rbz >/dev/null
          sha256sum TT_TaoVan_1.0.9_TaoNganKeo.rbz | awk '{print $1}' > rbz.sha256

      - name: Publish RBZ and manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj['version']='1.0.9'
          obj['rbz_url']='https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.0.9_TaoNganKeo.rbz'
          obj['sha256']=Path('rbz.sha256').read_text().strip()
          obj['notes']='Vision 1.0.9 - Bắt điểm thuận lợi hơn; điểm 1/2 có thể nằm trên Group con cùng tủ; InputPoint/tooltip; chuẩn mm; TAB ổn định.'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'TT Vision Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TT_TaoVan_1.0.9_TaoNganKeo.rbz update.json
          git commit -m 'Release TT Tạo Ván 1.0.9 - Easier drawer snapping' || true
          git push
