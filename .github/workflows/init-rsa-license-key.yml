name: Init RSA License Key

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  init-rsa-key:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public key from Supabase
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://vnvkmxqgbnmirsgdgfzm.supabase.co/functions/v1/tt-license-public-key | tee /tmp/rsa-public.json
          echo
          python - <<'PY'
          import json
          d=json.load(open('/tmp/rsa-public.json',encoding='utf-8'))
          if d.get('ok') is not True:
              raise SystemExit('RSA key init failed')
          print('KEY_ID='+str(d.get('key_id','')))
          print('ALGORITHM='+str(d.get('algorithm','')))
          print('FINGERPRINT_SHA256='+str(d.get('fingerprint_sha256','')))
          print('PUBLIC_KEY_BEGIN')
          print(d.get('public_key_pem',''))
          print('PUBLIC_KEY_END')
          PY
