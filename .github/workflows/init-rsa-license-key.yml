name: Verify RSA License Server

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-rsa-license:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public key and signed OWNER license
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://vnvkmxqgbnmirsgdgfzm.supabase.co/functions/v1/tt-license-public-key > /tmp/rsa-public.json
          curl -fsSL -X POST https://vnvkmxqgbnmirsgdgfzm.supabase.co/functions/v1/tt-license-check \
            -H 'Content-Type: application/json' \
            --data '{"machine_code":"TT-5ACF-3BBC-FCC6","plugin_version":"1.9.51"}' \
            > /tmp/license.json
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const pub = JSON.parse(fs.readFileSync('/tmp/rsa-public.json','utf8'));
          const res = JSON.parse(fs.readFileSync('/tmp/license.json','utf8'));
          if (pub.ok !== true || res.ok !== true) throw new Error('server response not ok');
          if (!res.signed_license) throw new Error('signed_license missing');
          if (res.signed_license.key_id !== pub.key_id) throw new Error('key id mismatch');
          const raw = Buffer.from(res.signed_license.data_b64, 'base64');
          const sig = Buffer.from(res.signed_license.signature_b64, 'base64');
          const ok = crypto.verify('RSA-SHA256', raw, pub.public_key_pem, sig);
          if (!ok) throw new Error('RSA signature invalid');
          const lic = JSON.parse(raw.toString('utf8'));
          if (lic.schema !== 'TT_LICENSE_RSA_V1') throw new Error('schema mismatch');
          if (lic.machine_code !== 'TT-5ACF-3BBC-FCC6') throw new Error('machine mismatch');
          if (lic.owner !== true) throw new Error('owner missing');
          if (Number(lic.feature_count) !== 8) throw new Error('feature_count mismatch');
          console.log('RSA LICENSE SERVER TEST OK');
          console.log('KEY_ID=' + pub.key_id);
          console.log('FINGERPRINT_SHA256=' + pub.fingerprint_sha256);
          console.log('OWNER=' + lic.owner + ' FEATURES=' + lic.feature_count + ' VALID_UNTIL=' + lic.valid_until);
          NODE
