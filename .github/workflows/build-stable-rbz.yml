name: Build Stable RBZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rbz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find tran_tuan_noi_that_release/files -name '*.rb' -print0 | xargs -0 -n1 ruby -c
          cat tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part1.inc \
              tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part2.inc \
              tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part3.inc \
              > /tmp/grain_tool_combined.rb
          ruby -c /tmp/grain_tool_combined.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/round_smooth_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_payment_v110.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v120.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v121_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_ui_v122_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v123_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v130_qr.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v140_auto.rb
          grep -Fq "VERSION = '1.4.0'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v140_auto.rb
          grep -Fq "auto_check_payment" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v140_auto.rb
          grep -Fq "ttStartPaymentPollingV140" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v140_auto.rb
          grep -Fq "8000" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v140_auto.rb
          grep -Fq "license_commercial_v140_auto.rb" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -Fq "license_commercial_v140_auto.rb" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          grep -Fq "License.allowed?" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -Fq "VERSION = '2.2.7'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/round_smooth_fix.rb
          grep -Fq "VERSION = '0.8.1'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v081_cut_offset_fix.rb
          grep -Fq "VERSION = '1.9.53'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -Fq "VERSION = '1.9.53'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          grep -Fq "ext.version = '1.9.53'" tran_tuan_noi_that_release/files/TranTuanNoiThat.rb
          grep -Fq '"version": "1.9.53"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"license_version": "1.4.0"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq 'license_commercial_v140_auto.rb' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"version": "1.9.53"' tran_tuan_noi_that_release/update.json
          grep -Fq '"license_version": "1.4.0"' tran_tuan_noi_that_release/update.json
          grep -Fq '"round_version": "2.2.7"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"layout_stats_version": "0.8.1"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"locked": true' tran_tuan_noi_that_release/BO_CONG_LOCK.json

      - name: Test License file cache
        shell: bash
        env:
          APPDATA: /tmp/tt_license_cache_test
        run: |
          set -euo pipefail
          rm -rf "$APPDATA"
          ruby <<'RUBY'
          module TranTuanNoiThat
            @settings = {}
            class << self
              def setting(key, default = nil); @settings.fetch(key.to_s, default); end
              def save_setting(key, value); @settings[key.to_s] = value; end
              def current_version; '1.9.53'; end
            end
          end
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb'
          license = TranTuanNoiThat::License
          features = {}
          %w[board box drawer round stretch_mode grain layout_stats render_ai].each do |slug|
            features[slug] = {'name'=>slug,'allowed'=>true,'purchased'=>true,'price_vnd'=>nil,'padding'=>'X'*900}
          end
          payload = {'ok'=>true,'api_version'=>2,'machine_status'=>'active','machine_role'=>'owner','owner'=>true,'commercial_enforcement'=>true,'offline_grace_hours'=>72,'feature_count'=>8,'features'=>features}
          license.save_cache(payload)
          raise 'cache file missing' unless File.file?(license.cache_file)
          license.instance_variable_set(:@memory_cache, nil)
          license.instance_variable_set(:@memory_cache_time, nil)
          restored = license.cache
          raise 'status lost' unless restored['machine_status'] == 'active'
          raise 'owner lost' unless restored['owner'] == true
          raise 'features lost' unless restored['features'].size == 8
          raise 'large payload truncated' unless restored['features']['board']['padding'].size == 900
          puts 'LICENSE CACHE TEST OK'
          RUBY

      - name: Validate License and Owner Admin JavaScript
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          module TranTuanNoiThat
            @settings = {}
            class << self
              def setting(key, default = nil); @settings.fetch(key.to_s, default); end
              def save_setting(key, value); @settings[key.to_s] = value; end
              def current_version; '1.9.53'; end
            end
          end
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_payment_v110.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v120.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v121_fix.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_ui_v122_fix.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v123_fix.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v130_qr.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_commercial_v140_auto.rb'
          license = TranTuanNoiThat::License

          html = license.dialog_html
          raise 'QR payment hook missing' unless html.include?('ttQrPaymentV130')
          raise 'auto payment polling missing' unless html.include?('ttStartPaymentPollingV140')
          raise 'auto payment callback missing' unless html.include?('auto_check_payment')
          raise 'ready callback missing' unless html.include?("document.addEventListener('DOMContentLoaded',()=>sketchup.ready());")
          script = html[/<script>(.*?)<\/script>/m, 1]
          raise 'license script missing' if script.to_s.empty?
          File.write('/tmp/tt_license_dialog.js', script)

          admin = license.owner_admin_html
          raise 'payment config missing' unless admin.include?('CÀI ĐẶT THANH TOÁN QR')
          raise 'payment save hook missing' unless admin.include?('set_payment_config')
          raise 'admin ready missing' unless admin.include?('sketchup.admin_ready()')
          admin_script = admin[/<script>(.*?)<\/script>/m, 1]
          raise 'owner admin script missing' if admin_script.to_s.empty?
          File.write('/tmp/tt_owner_admin.js', admin_script)
          puts 'LICENSE V1.4.0 HTML BUILD OK'
          RUBY
          node --check /tmp/tt_license_dialog.js
          node --check /tmp/tt_owner_admin.js

      - name: Build RBZ
        shell: bash
        run: |
          set -euo pipefail
          cd tran_tuan_noi_that_release/files
          zip -r "$GITHUB_WORKSPACE/TRANTUAN_NOI_THAT_1.9.53_STABLE.rbz" .

      - name: Upload RBZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRANTUAN_NOI_THAT_1.9.53_STABLE
          path: TRANTUAN_NOI_THAT_1.9.53_STABLE.rbz
          if-no-files-found: error
