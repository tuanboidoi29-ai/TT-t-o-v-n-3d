name: Build Stable RBZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rbz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ruby syntax and version
        shell: bash
        run: |
          set -euo pipefail
          find tran_tuan_noi_that_release/files -name '*.rb' -print0 | xargs -0 -n1 ruby -c
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_rsa_offline_v200.rb
          grep -Fq "VERSION = '2.0.0'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_rsa_offline_v200.rb
          grep -Fq "VERSION = '1.9.58'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -Fq "VERSION = '1.9.58'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          grep -Fq "ext.version = '1.9.58'" tran_tuan_noi_that_release/files/TranTuanNoiThat.rb
          grep -Fq "license_rsa_offline_v200.rb" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          ! grep -Eq 'license_payment_v110|license_owner_admin|license_commercial|license_rsa_v150|tt-license-check|tt-license-payment|tt-license-admin|commercial_enforcement' tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb

      - name: Validate 1.9.58 manifest
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'json'
          require 'digest'
          expected = {
            'TranTuanNoiThat.rb' => '841ab22b552fe4a6ecee564d333c3198cf31891ca2835af6defa075b8df94b6b',
            'tran_tuan_noi_that/bootstrap.rb' => 'ab5f2cc78ab2470df9eb18952cb37704d093bb3211cf29a75ed66507a1bbcbed',
            'tran_tuan_noi_that/license_rsa_offline_v200.rb' => '27cc4b0b319af98a6637334f1bb2a9466f50e9eec13edf66e4d82c95dbacc540',
            'tran_tuan_noi_that/settings.rb' => '7dd1023ae2b7573a880ba934d7ebe5361580cad9265aa1315306594ddbf4db0f'
          }
          %w[update_latest.json update.json].each do |name|
            data = JSON.parse(File.binread(File.join('tran_tuan_noi_that_release', name)))
            raise 'version' unless data['version'] == '1.9.58'
            raise 'license' unless data['license_version'] == '2.0.0'
            raise 'file count' unless Array(data['files']).length == 4
            Array(data['files']).each do |item|
              rel = item.fetch('path')
              raise "unexpected #{rel}" unless expected.key?(rel)
              raise "sha #{rel}" unless item.fetch('sha256') == expected.fetch(rel)
              local = File.join('tran_tuan_noi_that_release', 'files', rel)
              raise "local missing #{rel}" unless File.file?(local)
              raise "local sha #{rel}" unless Digest::SHA256.file(local).hexdigest == expected.fetch(rel)
            end
          end
          puts 'MANIFEST 1.9.58 OK'
          RUBY

      - name: Test offline RSA verification
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          require 'time'
          module TranTuanNoiThat
            ROOT = '/tmp/tt_none'
            @settings = {}
            class << self
              def setting(k,d=nil); @settings.fetch(k.to_s,d); end
              def save_setting(k,v); @settings[k.to_s]=v; end
            end
          end
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_rsa_offline_v200.rb'
          lic = TranTuanNoiThat::License
          key = OpenSSL::PKey::RSA.new(2048)
          now = Time.now
          machine = 'TT-TEST-TEST-TEST'
          make = lambda do |plan, expires_at|
            data = {
              'schema'=>lic::LICENSE_SCHEMA, 'alg'=>lic::RSA_ALGORITHM, 'key_id'=>lic::RSA_KEY_ID,
              'license_id'=>'TEST-LICENSE', 'machine_code'=>machine, 'plan'=>plan,
              'issued_at'=>now.utc.iso8601, 'expires_at'=>expires_at
            }
            raw = JSON.generate(data)
            sig = key.sign(OpenSSL::Digest::SHA256.new, raw)
            enc = ->(x){ Base64.urlsafe_encode64(x, padding: false) }
            "#{lic::LICENSE_PREFIX}.#{enc.call(raw)}.#{enc.call(sig)}"
          end
          code = make.call('90d', (now + 90*86400).utc.iso8601)
          good = lic.parse_activation_code(code, key.public_key.to_pem, machine, now)
          raise 'valid rejected' unless good['rsa_verified'] == true && good['plan'] == '90d'
          begin
            lic.parse_activation_code(code, key.public_key.to_pem, 'TT-OTHR-0000-0000', now)
            raise 'copy accepted'
          rescue RuntimeError => e
            raise if e.message == 'copy accepted'
          end
          expired = make.call('90d', (now - 86400).utc.iso8601)
          begin
            lic.parse_activation_code(expired, key.public_key.to_pem, machine, now)
            raise 'expired accepted'
          rescue RuntimeError => e
            raise if e.message == 'expired accepted'
          end
          life = make.call('lifetime', nil)
          life_state = lic.parse_activation_code(life, key.public_key.to_pem, machine, now)
          raise 'lifetime rejected' unless life_state['lifetime'] == true
          html = lic.dialog_html
          raise 'zalo missing' unless html.include?('033816946')
          raise 'bank missing' unless html.include?('0338162946') && html.include?('KienlongBank')
          raise 'price missing' unless html.include?('50.000đ') && html.include?('100.000đ') && html.include?('120.000đ') && html.include?('200.000đ')
          script = html[/<script>(.*?)<\/script>/m,1]
          File.write('/tmp/tt_rsa_offline_ui.js', script)
          puts 'RSA OFFLINE VERIFY OK'
          RUBY
          node --check /tmp/tt_rsa_offline_ui.js

      - name: Build clean 1.9.58 RBZ
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/tt_1958"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a tran_tuan_noi_that_release/files/ "$STAGE/" \
            --exclude 'tran_tuan_noi_that/license_manager.rb' \
            --exclude 'tran_tuan_noi_that/license_payment_v110.rb' \
            --exclude 'tran_tuan_noi_that/license_owner_admin_v120.rb' \
            --exclude 'tran_tuan_noi_that/license_owner_admin_v121_fix.rb' \
            --exclude 'tran_tuan_noi_that/license_ui_v122_fix.rb' \
            --exclude 'tran_tuan_noi_that/license_owner_admin_v123_fix.rb' \
            --exclude 'tran_tuan_noi_that/license_commercial_v130_qr.rb' \
            --exclude 'tran_tuan_noi_that/license_commercial_v140_auto.rb' \
            --exclude 'tran_tuan_noi_that/license_rsa_v150.rb'
          cd "$STAGE"
          zip -r "$GITHUB_WORKSPACE/TRANTUAN_NOI_THAT_1.9.58_STABLE.rbz" .
          unzip -t "$GITHUB_WORKSPACE/TRANTUAN_NOI_THAT_1.9.58_STABLE.rbz"
          if unzip -l "$GITHUB_WORKSPACE/TRANTUAN_NOI_THAT_1.9.58_STABLE.rbz" | grep -Eq 'license_(payment|owner_admin|commercial|manager|rsa_v150)'; then
            echo 'Legacy commercial license file leaked into RBZ' >&2
            exit 1
          fi
          unzip -l "$GITHUB_WORKSPACE/TRANTUAN_NOI_THAT_1.9.58_STABLE.rbz" | grep -F 'license_rsa_offline_v200.rb'

      - name: Build updater package
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/tt_1958_update"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/tran_tuan_noi_that"
          cp tran_tuan_noi_that_release/files/TranTuanNoiThat.rb "$STAGE/"
          cp tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb "$STAGE/tran_tuan_noi_that/"
          cp tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_rsa_offline_v200.rb "$STAGE/tran_tuan_noi_that/"
          cp tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb "$STAGE/tran_tuan_noi_that/"
          cp tran_tuan_noi_that_release/update_latest.json "$STAGE/"
          cd "$STAGE"
          zip -r "$GITHUB_WORKSPACE/TRANTUAN_RSA_OFFLINE_2.0.0_UPDATE.zip" .
          unzip -t "$GITHUB_WORKSPACE/TRANTUAN_RSA_OFFLINE_2.0.0_UPDATE.zip"

      - name: Upload stable RBZ
        uses: actions/upload-artifact@v4
        with:
          name: TRANTUAN_NOI_THAT_1.9.58_STABLE
          path: TRANTUAN_NOI_THAT_1.9.58_STABLE.rbz
          if-no-files-found: error

      - name: Upload RSA offline update
        uses: actions/upload-artifact@v4
        with:
          name: TRANTUAN_RSA_OFFLINE_2.0.0_UPDATE
          path: TRANTUAN_RSA_OFFLINE_2.0.0_UPDATE.zip
          if-no-files-found: error
