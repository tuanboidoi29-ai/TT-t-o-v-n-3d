name: Build Stable RBZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rbz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find tran_tuan_noi_that_release/files -name '*.rb' -print0 | xargs -0 -n1 ruby -c
          cat tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part1.inc \
              tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part2.inc \
              tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part3.inc \
              > /tmp/grain_tool_combined.rb
          ruby -c /tmp/grain_tool_combined.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_material_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_align_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_standard_2440_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v050_stable_preview.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v060_compact_scope.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v070_export_split.rb
          grep -q "layout_stats_v070_export_split.rb" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          grep -q "VERSION = '0.7.0'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v070_export_split.rb
          grep -q "tt_build_views_only_document" tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v070_export_split.rb
          grep -q "tt_build_pdf_document" tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v070_export_split.rb
          grep -q "VERSION = '1.9.38'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -q "VERSION = '1.9.38'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          grep -q "ext.version = '1.9.38'" tran_tuan_noi_that_release/files/TranTuanNoiThat.rb
          grep -q '"version": "1.9.38"' tran_tuan_noi_that_release/update_latest.json
          grep -q '"grain_version": "3.4.0"' tran_tuan_noi_that_release/update_latest.json
          grep -q '"layout_stats_version": "0.7.0"' tran_tuan_noi_that_release/update_latest.json
          grep -q 'layout_stats_v070_export_split.rb' tran_tuan_noi_that_release/update_latest.json
          grep -q '"locked": false' tran_tuan_noi_that_release/LAYOUT_STATS_LOCK.json

      - name: Build RBZ
        shell: bash
        run: |
          set -euo pipefail
          cd tran_tuan_noi_that_release/files
          zip -r "$GITHUB_WORKSPACE/TRANTUAN_NOI_THAT_1.9.38_STABLE.rbz" .

      - name: Upload RBZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRANTUAN_NOI_THAT_1.9.38_STABLE
          path: TRANTUAN_NOI_THAT_1.9.38_STABLE.rbz
          if-no-files-found: error
