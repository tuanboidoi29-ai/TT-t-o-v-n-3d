name: Build Stable RBZ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rbz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find tran_tuan_noi_that_release/files -name '*.rb' -print0 | xargs -0 -n1 ruby -c
          cat tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part1.inc \
              tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part2.inc \
              tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_tool_part3.inc \
              > /tmp/grain_tool_combined.rb
          ruby -c /tmp/grain_tool_combined.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/round_smooth_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_payment_v110.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v120.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v121_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_ui_v122_fix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_production_v350.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/grain_production_v350_hotfix.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v080_five_pages.rb
          ruby -c tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v081_cut_offset_fix.rb
          grep -Fq "VERSION = '2.2.7'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/round_smooth_fix.rb
          grep -Fq "topology_boundary_edges" tran_tuan_noi_that_release/files/tran_tuan_noi_that/round_smooth_fix.rb
          grep -Fq "VERSION = '1.0.2'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb
          grep -Fq "license_cache_v3.json" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb
          grep -Fq "@memory_cache" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb
          grep -Fq "VERSION = '1.1.0'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_payment_v110.rb
          grep -Fq "tt-license-payment" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_payment_v110.rb
          grep -Fq "buy_feature" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_payment_v110.rb
          grep -Fq "VERSION = '1.2.0'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v120.rb
          grep -Fq "tt-license-admin" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v120.rb
          grep -Fq "owner_admin_open" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v120.rb
          grep -Fq "VERSION = '1.2.1'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v121_fix.rb
          grep -Fq "VERSION = '1.2.2'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_ui_v122_fix.rb
          grep -Fq "data-slug" tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_ui_v122_fix.rb
          grep -Fq "license_ui_v122_fix.rb" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -Fq "license_ui_v122_fix.rb" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          grep -Fq "License.allowed?" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -Fq "VERSION = '0.8.1'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/layout_stats_v081_cut_offset_fix.rb
          grep -Fq "VERSION = '1.9.50'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb
          grep -Fq "VERSION = '1.9.50'" tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
          grep -Fq "ext.version = '1.9.50'" tran_tuan_noi_that_release/files/TranTuanNoiThat.rb
          grep -Fq '"version": "1.9.50"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"license_version": "1.2.2"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq 'license_ui_v122_fix.rb' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"round_version": "2.2.7"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"layout_stats_version": "0.8.1"' tran_tuan_noi_that_release/update_latest.json
          grep -Fq '"locked": true' tran_tuan_noi_that_release/BO_CONG_LOCK.json
          grep -Fq '"round_version": "2.2.7"' tran_tuan_noi_that_release/BO_CONG_LOCK.json

      - name: Test License file cache
        shell: bash
        env:
          APPDATA: /tmp/tt_license_cache_test
        run: |
          set -euo pipefail
          rm -rf "$APPDATA"
          ruby <<'RUBY'
          module TranTuanNoiThat
            @settings = {}
            class << self
              def setting(key, default = nil)
                @settings.fetch(key.to_s, default)
              end
              def save_setting(key, value)
                @settings[key.to_s] = value
              end
              def current_version
                '1.9.50'
              end
            end
          end

          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb'
          license = TranTuanNoiThat::License
          features = {}
          %w[board box drawer round stretch_mode grain layout_stats render_ai].each do |slug|
            features[slug] = {
              'name' => slug,
              'allowed' => true,
              'purchased' => true,
              'price_vnd' => nil,
              'padding' => 'X' * 900
            }
          end
          payload = {
            'ok' => true,
            'api_version' => 2,
            'machine_status' => 'active',
            'machine_role' => 'owner',
            'owner' => true,
            'commercial_enforcement' => false,
            'offline_grace_hours' => 72,
            'feature_count' => 8,
            'features' => features
          }
          license.save_cache(payload)
          raise 'cache file missing' unless File.file?(license.cache_file)
          license.instance_variable_set(:@memory_cache, nil)
          license.instance_variable_set(:@memory_cache_time, nil)
          restored = license.cache
          raise 'status lost' unless restored['machine_status'] == 'active'
          raise 'owner lost' unless restored['owner'] == true
          raise 'features lost' unless restored['features'].size == 8
          raise 'large payload truncated' unless restored['features']['board']['padding'].size == 900
          raise 'cache time missing' unless license.cache_time > 0
          puts 'LICENSE CACHE TEST OK'
          RUBY

      - name: Validate License dialog JavaScript
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          module TranTuanNoiThat
            @settings = {}
            class << self
              def setting(key, default = nil); @settings.fetch(key.to_s, default); end
              def save_setting(key, value); @settings[key.to_s] = value; end
              def current_version; '1.9.50'; end
            end
          end
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_manager.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_payment_v110.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v120.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_owner_admin_v121_fix.rb'
          load 'tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_ui_v122_fix.rb'
          html = TranTuanNoiThat::License.dialog_html
          raise 'owner launcher missing' unless html.include?('ownerAdminLauncher')
          raise 'ready callback missing' unless html.include?("document.addEventListener('DOMContentLoaded',()=>sketchup.ready());")
          raise 'old render wrapper still present' if html.include?('ttRenderLicenseV120')
          raise 'broken buy quote still present' if html.include?(%q{onclick="buy(''})
          raise 'broken paymentCode quote still present' if html.include?(%q{el('paymentCode')})
          script = html[/<script>(.*?)<\/script>/m, 1]
          raise 'license script missing' if script.to_s.empty?
          File.write('/tmp/tt_license_dialog.js', script)
          puts 'LICENSE HTML BUILD OK'
          RUBY
          node --check /tmp/tt_license_dialog.js

      - name: Build RBZ
        shell: bash
        run: |
          set -euo pipefail
          cd tran_tuan_noi_that_release/files
          zip -r "$GITHUB_WORKSPACE/TRANTUAN_NOI_THAT_1.9.50_STABLE.rbz" .

      - name: Upload RBZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRANTUAN_NOI_THAT_1.9.50_STABLE
          path: TRANTUAN_NOI_THAT_1.9.50_STABLE.rbz
          if-no-files-found: error
