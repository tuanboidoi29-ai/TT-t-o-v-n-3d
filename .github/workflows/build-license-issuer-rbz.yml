name: Build TT License Issuer OWNER RBZ

on:
  push:
    branches: [main]
    paths:
      - 'tt_license_issuer_release/**'
      - '.github/workflows/build-license-issuer-rbz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-issuer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ruby and no private key
        shell: bash
        run: |
          set -euo pipefail
          ruby -c tt_license_issuer_release/files/TT_License_Issuer.rb
          ruby -c tt_license_issuer_release/files/tt_license_issuer/signer.rb
          ruby -c tt_license_issuer_release/files/tt_license_issuer/main.rb
          grep -Fq "VERSION = '1.0.0'" tt_license_issuer_release/files/tt_license_issuer/signer.rb
          grep -Fq "EXPECTED_PUBLIC_FINGERPRINT = '33c04cf83b7d0a85e842d210854ffef499001a90c7ecd93681bc5f58e263ddc6'" tt_license_issuer_release/files/tt_license_issuer/signer.rb
          if grep -R -E 'BEGIN (RSA )?PRIVATE KEY' tt_license_issuer_release/files; then
            echo 'PRIVATE KEY MUST NOT BE IN RBZ SOURCE' >&2
            exit 1
          fi

      - name: Test RSA activation generation
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'
          require 'time'
          require_relative './tt_license_issuer_release/files/tt_license_issuer/signer'

          s = TTLicenseIssuer::Signer
          key = OpenSSL::PKey::RSA.new(2048)
          fp = s.public_fingerprint(key)
          machine = 'TT-ABCD-1234-EF56'
          now = Time.utc(2026, 9, 17, 0, 0, 0)

          s::PLANS.each_key do |plan|
            out = s.generate(machine, plan, key, now: now, expected_fingerprint: fp)
            raise 'generation failed' unless out['ok'] == true
            parts = out['activation_code'].split('.')
            raise 'bad prefix' unless parts.length == 3 && parts[0] == 'TTRSA2'
            decode = ->(x) do
              v = x.tr('-_', '+/')
              v += '=' * ((4 - v.length % 4) % 4)
              Base64.strict_decode64(v)
            end
            raw = decode.call(parts[1])
            sig = decode.call(parts[2])
            raise 'signature failed' unless key.public_key.verify(OpenSSL::Digest::SHA256.new, sig, raw)
            data = JSON.parse(raw)
            raise 'machine mismatch' unless data['machine_code'] == machine
            raise 'plan mismatch' unless data['plan'] == plan
            raise 'schema mismatch' unless data['schema'] == 'TT_OFFLINE_RSA_V2'
            raise 'key id mismatch' unless data['key_id'] == 'tt-offline-rsa-20260917'
            if plan == 'lifetime'
              raise 'lifetime expiry' unless data['expires_at'].nil?
            else
              raise 'expiry missing' if data['expires_at'].to_s.empty?
            end
          end

          begin
            s.generate('WRONG', '90d', key, now: now, expected_fingerprint: fp)
            raise 'invalid machine accepted'
          rescue RuntimeError => e
            raise if e.message == 'invalid machine accepted'
          end

          puts 'OWNER ISSUER RSA TEST OK'
          RUBY

      - name: Validate HtmlDialog JavaScript
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          src = File.binread('tt_license_issuer_release/files/tt_license_issuer/main.rb')
          js = src[/<script>\s*(.*?)\s*<\/script>/m, 1]
          raise 'script missing' if js.to_s.empty?
          File.write('/tmp/tt_license_issuer_ui.js', js)
          puts 'ISSUER HTML SCRIPT EXTRACT OK'
          RUBY
          node --check /tmp/tt_license_issuer_ui.js

      - name: Build standalone OWNER RBZ
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/tt_license_issuer_owner"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          rsync -a tt_license_issuer_release/files/ "$STAGE/"
          cd "$STAGE"
          zip -r "$GITHUB_WORKSPACE/TT_LICENSE_ISSUER_OWNER_1.0.0.rbz" .
          unzip -t "$GITHUB_WORKSPACE/TT_LICENSE_ISSUER_OWNER_1.0.0.rbz"
          if unzip -p "$GITHUB_WORKSPACE/TT_LICENSE_ISSUER_OWNER_1.0.0.rbz" | grep -E 'BEGIN (RSA )?PRIVATE KEY'; then
            echo 'PRIVATE KEY LEAKED INTO RBZ' >&2
            exit 1
          fi

      - name: Upload OWNER issuer RBZ
        uses: actions/upload-artifact@v4
        with:
          name: TT_LICENSE_ISSUER_OWNER_1.0.0
          path: TT_LICENSE_ISSUER_OWNER_1.0.0.rbz
          if-no-files-found: error
