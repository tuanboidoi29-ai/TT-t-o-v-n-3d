name: Hash 1.9.58 temp

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print source hashes
        shell: bash
        run: |
          sha256sum \
            tran_tuan_noi_that_release/files/TranTuanNoiThat.rb \
            tran_tuan_noi_that_release/files/tran_tuan_noi_that/bootstrap.rb \
            tran_tuan_noi_that_release/files/tran_tuan_noi_that/license_rsa_offline_v200.rb \
            tran_tuan_noi_that_release/files/tran_tuan_noi_that/settings.rb
