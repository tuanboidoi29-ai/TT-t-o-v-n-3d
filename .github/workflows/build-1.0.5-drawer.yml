name: Build TT Tạo Ngăn Kéo 1.1.3

on:
  push:
    paths:
      - '.github/workflows/build-1.0.5-drawer.yml'
      - 'release_1.0.5/TT_TaoVan/drawer.rb'
      - 'release_1.0.5/TT_TaoVan/main.rb'
      - 'release_1.0.5/TT_TaoVan/version.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tt-tao-van-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean RBZ 1.1.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_tt
          mkdir -p build_tt/pkg
          curl -fsSL 'https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.1.2_TaoNganKeo.rbz' -o build_tt/base.rbz
          unzip -q build_tt/base.rbz -d build_tt/pkg
          test -f build_tt/pkg/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/drawer.rb build_tt/pkg/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/main.rb build_tt/pkg/TT_TaoVan/main.rb
          printf '1.1.3\n' > build_tt/pkg/TT_TaoVan/version.txt

          python3 - <<'PY'
          from pathlib import Path

          # Bản phát hành mới dùng trực tiếp AUTO; không còn đường khởi động bảng cài đặt cũ.
          p = Path('build_tt/pkg/TT_TaoVan/drawer.rb')
          s = p.read_text(encoding='utf-8')
          old = '''      def start\n        show_settings\n      end'''
          new = '''      def start\n        Sketchup.active_model.select_tool(TwoPointTool.new(defaults))\n      end'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # TAB chỉ mở bảng cài đặt; ESC thoát AUTO.
          old_key = '''        def onKeyDown(key,_repeat,_flags,_view)\n          Sketchup.active_model.select_tool(nil) if key==27\n        end'''
          new_key = '''        def onKeyDown(key,_repeat,_flags,_view)\n          if key == TAB_KEY\n            Drawer.show_settings\n          elsif key == 27\n            Sketchup.active_model.select_tool(nil)\n          end\n        end'''
          if old_key in s:
              s = s.replace(old_key, new_key, 1)
          p.write_text(s, encoding='utf-8')

          # Kiểm tra không còn lệnh menu ngăn kéo cũ trong main.rb.
          main = Path('build_tt/pkg/TT_TaoVan/main.rb').read_text(encoding='utf-8')
          if 'Tạo ngăn kéo cũ' in main or 'Tạo ngăn kéo thủ công' in main:
              raise SystemExit('Legacy drawer UI still present')
          PY

          ruby -c build_tt/pkg/TT_TaoVan/drawer.rb
          ruby -c build_tt/pkg/TT_TaoVan/main.rb
          rm -f TT_TaoVan_1.1.3_TaoNganKeo.rbz
          (cd build_tt/pkg && zip -qr ../../TT_TaoVan_1.1.3_TaoNganKeo.rbz .)
          unzip -t TT_TaoVan_1.1.3_TaoNganKeo.rbz >/dev/null
          unzip -p TT_TaoVan_1.1.3_TaoNganKeo.rbz TT_TaoVan/main.rb | grep -q 'AUTO: Click 2 điểm chéo bất kỳ'
          sha=$(sha256sum TT_TaoVan_1.1.3_TaoNganKeo.rbz | awk '{print $1}')
          echo "RBZ_SHA=$sha" >> "$GITHUB_ENV"

      - name: Publish RBZ 1.1.3 and update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('update.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj['version']='1.1.3'
          obj['rbz_url']='https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.1.3_TaoNganKeo.rbz'
          obj['sha256']=os.environ['RBZ_SHA']
          obj['notes']='TT Tạo Ngăn Kéo 1.1.3 - loại bỏ UI/lệnh Ngăn Kéo cũ; chỉ giữ AUTO 2 điểm; TAB mở cài đặt; ESC thoát; tạo liên tục không ngắt quãng; hot update thay thế command cũ; đơn vị mm.'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'TT Vision Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TT_TaoVan_1.1.3_TaoNganKeo.rbz update.json
          git commit -m 'Release TT Tạo Ngăn Kéo 1.1.3 - remove legacy drawer UI' || true
          git push
