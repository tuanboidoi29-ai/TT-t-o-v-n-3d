name: Build TT Tạo Ván 1.0.7 - Tạo Ngăn Kéo

on:
  push:
    paths:
      - '.github/workflows/build-1.0.5-drawer.yml'
      - 'release_1.0.5/TT_TaoVan/drawer.rb'
      - 'release_1.0.5/TT_TaoVan/version.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tt-tao-van-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean RBZ 1.0.7
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_tt
          mkdir -p build_tt/pkg
          curl -fsSL 'https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.0.5_TaoNganKeo.rbz' -o build_tt/base.rbz
          unzip -q build_tt/base.rbz -d build_tt/pkg
          test -f build_tt/pkg/TT_TaoVan/drawer.rb
          mkdir -p build_tt/pkg/TT_TaoVan/icons
          cp release_1.0.5/TT_TaoVan/drawer.rb build_tt/pkg/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/version.txt build_tt/pkg/TT_TaoVan/version.txt
          python3 -m pip install --disable-pip-version-check -q Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          p=Path('build_tt/pkg/TT_TaoVan/icons')
          for n in (16,32):
              im=Image.new('RGBA',(n,n),(0,0,0,0)); d=ImageDraw.Draw(im)
              q=max(2,n//8)
              d.rounded_rectangle((q,q,n-q,n-q),radius=max(2,n//7),fill=(255,128,0,255),outline=(255,255,255,255),width=max(1,n//12))
              y=int(n*.48); d.line((n*.30,y,n*.70,y),fill=(255,255,255,255),width=max(1,n//10))
              d.line((n*.25,int(n*.68),n*.75,int(n*.68)),fill=(255,255,255,255),width=max(1,n//12))
              im.save(p/f'tao_ngan_keo_{n}.png')
          PY
          ruby -c build_tt/pkg/TT_TaoVan/drawer.rb
          rm -f TT_TaoVan_1.0.7_TaoNganKeo.rbz
          (cd build_tt/pkg && zip -qr ../../TT_TaoVan_1.0.7_TaoNganKeo.rbz .)
          unzip -t TT_TaoVan_1.0.7_TaoNganKeo.rbz >/dev/null
          sha=$(sha256sum TT_TaoVan_1.0.7_TaoNganKeo.rbz | awk '{print $1}')
          echo "RBZ_SHA=$sha" >> "$GITHUB_ENV"

      - name: Publish RBZ 1.0.7 and update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('update.json'); obj=json.loads(p.read_text(encoding='utf-8'))
          obj['version']='1.0.7'
          obj['rbz_url']='https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.0.7_TaoNganKeo.rbz'
          obj['sha256']=os.environ['RBZ_SHA']
          obj['notes']='Vision 1.0.7 - Tạo Ngăn Kéo: sửa ngược hướng; kích thước tự động theo trục local của Group/Component; TAB chuyển TỰ ĐỘNG 2 ĐIỂM / THỦ CÔNG ổn định; chuẩn hóa mm; preview 3D; Menu + Icon.'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'TT Vision Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TT_TaoVan_1.0.7_TaoNganKeo.rbz update.json
          git commit -m 'Release TT Tạo Ván 1.0.7 - Fix drawer orientation dimensions TAB' || true
          git push
