name: Build TT Tạo Ngăn Kéo 1.1.0

on:
  push:
    paths:
      - '.github/workflows/build-1.0.5-drawer.yml'
      - 'release_1.0.5/TT_TaoVan/drawer.rb'
      - 'release_1.0.5/TT_TaoVan/version.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tt-tao-van-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean RBZ 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_tt
          mkdir -p build_tt/pkg
          curl -fsSL 'https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.0.9_TaoNganKeo.rbz' -o build_tt/base.rbz
          unzip -q build_tt/base.rbz -d build_tt/pkg
          test -f build_tt/pkg/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/drawer.rb build_tt/pkg/TT_TaoVan/drawer.rb
          printf '1.1.0\n' > build_tt/pkg/TT_TaoVan/version.txt
          ruby -c build_tt/pkg/TT_TaoVan/drawer.rb
          rm -f TT_TaoVan_1.1.0_TaoNganKeo.rbz
          (cd build_tt/pkg && zip -qr ../../TT_TaoVan_1.1.0_TaoNganKeo.rbz .)
          unzip -t TT_TaoVan_1.1.0_TaoNganKeo.rbz >/dev/null
          sha=$(sha256sum TT_TaoVan_1.1.0_TaoNganKeo.rbz | awk '{print $1}')
          echo "RBZ_SHA=$sha" >> "$GITHUB_ENV"

      - name: Publish RBZ 1.1.0 and update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('update.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj['version']='1.1.0'
          obj['rbz_url']='https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.1.0_TaoNganKeo.rbz'
          obj['sha256']=os.environ['RBZ_SHA']
          obj['notes']='TT Tạo Ngăn Kéo 1.1.0 - chỉ còn chức năng AUTO; bảng thiết lập khe hở và độ dày; click 2 điểm chéo bất kỳ; tự tính Rộng/Sâu/Cao vùng và kích thước thực tế ngăn kéo; hỗ trợ trục local Group/Component; preview 3D; đơn vị mm.'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'TT Vision Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TT_TaoVan_1.1.0_TaoNganKeo.rbz update.json
          git commit -m 'Release TT Tạo Ngăn Kéo 1.1.0 - Automatic two-point drawer' || true
          git push
