name: Build TT Tạo Ngăn Kéo 1.3.2

# 1.3.2: remove Hậu thickness field; explicit Hậu Lọt / Hậu Phủ; real 3D preview.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release_1.0.5/TT_TaoVan/main.rb'
      - 'release_1.0.5/TT_TaoVan/update.rb'
      - 'release_1.0.5/TT_TaoVan/drawer.rb'
      - 'release_1.0.5/TT_TaoVan/drawer_config.rb'
      - 'release_1.0.5/TT_TaoVan/drawer_preview.rb'
      - 'release_1.0.5/TT_TaoVan/core.rb'
      - 'release_1.0.5/TT_TaoVan/box.rb'
      - 'release_1.0.5/TT_TaoVan/version.txt'
      - '.github/workflows/build-1.2.3-drawer.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: tt-tao-van-1-3-2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Build RBZ 1.3.2
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build_tt
          mkdir -p build_tt/pkg
          curl -fsSL 'https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.2.2_TaoNganKeo.rbz' -o build_tt/base.rbz
          unzip -q build_tt/base.rbz -d build_tt/pkg
          cp release_1.0.5/TT_TaoVan/main.rb build_tt/pkg/TT_TaoVan/main.rb
          cp release_1.0.5/TT_TaoVan/update.rb build_tt/pkg/TT_TaoVan/update.rb
          cp release_1.0.5/TT_TaoVan/drawer.rb build_tt/pkg/TT_TaoVan/drawer.rb
          cp release_1.0.5/TT_TaoVan/drawer_config.rb build_tt/pkg/TT_TaoVan/drawer_config.rb
          cp release_1.0.5/TT_TaoVan/drawer_preview.rb build_tt/pkg/TT_TaoVan/drawer_preview.rb
          cp release_1.0.5/TT_TaoVan/core.rb build_tt/pkg/TT_TaoVan/core.rb
          cp release_1.0.5/TT_TaoVan/box.rb build_tt/pkg/TT_TaoVan/box.rb
          printf '1.3.2\n' > build_tt/pkg/TT_TaoVan/version.txt
          ruby -c build_tt/pkg/TT_TaoVan/main.rb
          ruby -c build_tt/pkg/TT_TaoVan/update.rb
          ruby -c build_tt/pkg/TT_TaoVan/drawer.rb
          ruby -c build_tt/pkg/TT_TaoVan/drawer_config.rb
          ruby -c build_tt/pkg/TT_TaoVan/drawer_preview.rb
          ruby -c build_tt/pkg/TT_TaoVan/core.rb
          ruby -c build_tt/pkg/TT_TaoVan/box.rb
          rm -f TT_TaoVan_1.3.2_TaoNganKeo.rbz
          (cd build_tt/pkg && zip -qr ../../TT_TaoVan_1.3.2_TaoNganKeo.rbz .)
          unzip -t TT_TaoVan_1.3.2_TaoNganKeo.rbz >/dev/null
          sha256sum TT_TaoVan_1.3.2_TaoNganKeo.rbz | awk '{print $1}' > rbz.sha256
      - name: Upload RBZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: TT_TaoVan_1.3.2_TaoNganKeo
          path: TT_TaoVan_1.3.2_TaoNganKeo.rbz
          if-no-files-found: error
          retention-days: 30
      - name: Prepare manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('update.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          obj['version']='1.3.2'
          obj['rbz_url']='https://raw.githubusercontent.com/tuanboidoi29-ai/TT-t-o-v-n-3d/main/TT_TaoVan_1.3.2_TaoNganKeo.rbz'
          obj['sha256']=Path('rbz.sha256').read_text().strip()
          obj['notes']='TT Tạo Ngăn Kéo 1.3.2: bỏ mục Độ dày tấm hậu khỏi bảng Cài đặt; Hậu tự động dùng độ dày tấm đáy; thêm chọn HẬU LỌT/HẬU PHỦ rõ ràng; Hậu lọt offset mép 9 mm; Hậu phủ offset mép 0 mm; offset đáy 15 mm tính từ mặt dưới 4 thành; preview 3D theo đúng chế độ; HOT RELOAD.'
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Publish safely with preserved build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'TT Vision Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp TT_TaoVan_1.3.2_TaoNganKeo.rbz /tmp/TT_TaoVan_1.3.2_TaoNganKeo.rbz
          cp update.json /tmp/update.json
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/TT_TaoVan_1.3.2_TaoNganKeo.rbz TT_TaoVan_1.3.2_TaoNganKeo.rbz
            cp /tmp/update.json update.json
            git add TT_TaoVan_1.3.2_TaoNganKeo.rbz update.json
            git commit -m 'Release TT Tao Ngan Keo 1.3.2' || true
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo 'Publish failed after retries.' >&2
          exit 1
