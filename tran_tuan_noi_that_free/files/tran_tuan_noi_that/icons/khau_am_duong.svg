<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Khấu âm dương</title>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A8D8FF"/>
      <stop offset="1" stop-color="#1D78D2"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A8D8FF"/>
      <stop offset="1" stop-color="#1D78D2"/>
    </linearGradient>
    <linearGradient id="edgeBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D78D2"/>
      <stop offset="1" stop-color="#1D78D2"/>
    </linearGradient>
    <linearGradient id="edgePink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D78D2"/>
      <stop offset="1" stop-color="#0A3D7A"/>
    </linearGradient>
  </defs>

  <ellipse cx="32" cy="56" rx="25" ry="4" fill="#0A3D7A" opacity=".12"/>

  <!-- Tấm A xanh -->
  <path d="M5 35 L38 9 L47 16 L14 42 Z"
        fill="url(#blue)" stroke="#1D78D2" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M14 42 L47 16 L47 22 L14 48 Z"
        fill="url(#edgeBlue)" stroke="#1D78D2" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Rãnh 1/2 trên A -->
  <path d="M26 28 L33 22 L39 27 L32 33 Z"
        fill="#FFFFFF" stroke="#0A3D7A" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Tấm B hồng -->
  <path d="M17 14 L55 44 L47 52 L9 22 Z"
        fill="url(#pink)" stroke="#1D78D2" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M47 52 L55 44 L55 50 L47 58 L9 28 L9 22 Z"
        fill="url(#edgePink)" stroke="#1D78D2" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Rãnh đối nghịch 1/2 trên B / tâm khớp -->
  <path d="M25 27 L32 21 L39 27 L32 34 Z"
        fill="#FFFFFF" stroke="#0A3D7A" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M28 30 L32 27 L36 30 L32 34 Z"
        fill="#FFFFFF" stroke="#0A3D7A" stroke-width=".9" stroke-linejoin="round"/>

  <!-- ký hiệu 1/2 -->
  <circle cx="51" cy="12" r="8" fill="#FFFFFF" stroke="#0A3D7A" stroke-width="1.4"/>
  <text x="51" y="15.2" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="8.5" font-weight="700"
        fill="#0A3D7A">1/2</text>
</svg>
