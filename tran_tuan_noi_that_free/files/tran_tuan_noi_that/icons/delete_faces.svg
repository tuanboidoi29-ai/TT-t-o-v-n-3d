        fill="none" stroke="#A8D8FF" stroke-width="3" stroke-linecap="round"/>
  <!-- mặt bị xóa -->
  <path d="M10 18 L34 8 L30 30 Z"
        fill="url(#b)" opacity=".45" stroke="#0A3D7A" stroke-width="1.5"/>
  <!-- dấu X -->
  <circle cx="50" cy="13" r="10" fill="#1677E8" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M46 9 L54 17 M54 9 L46 17"
