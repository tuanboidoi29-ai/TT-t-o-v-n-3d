<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#111827;color:#e5e7eb}.head{padding:22px;background:linear-gradient(135deg,#f97316,#c2410c)}h1{font-size:20px;margin:0}.sub{opacity:.9;margin-top:5px}.body{padding:20px}.card{background:#1f2937;border:1px solid #374151;border-radius:12px;padding:16px;margin-bottom:14px}label{display:block;margin:9px 0 6px;color:#f3f4f6}input,select{width:100%;padding:10px;border:1px solid #4b5563;border-radius:8px;background:#111827;color:white}.check{display:flex;gap:10px;align-items:center}.check input{width:auto}.features{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feature{display:flex;align-items:center;gap:9px;padding:10px;border-radius:8px;background:#111827}.feature input{width:auto}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{padding:11px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.primary{background:#f97316;color:white}.dark{background:#374151;color:white}.notice{min-height:38px;margin-top:12px;padding:10px;border-radius:8px;display:none}.ok{display:block;background:#064e3b}.error{display:block;background:#7f1d1d}.version{font-weight:bold;color:#fdba74}
</style></head><body><div class="head"><h1>TRẦN TUẤN NỘI THẤT</h1><div class="sub">Cài đặt chung toàn hệ thống • v<span id="version">-</span></div></div><div class="body">
<div class="card"><label>Độ dày ván mặc định (mm)</label><input id="thickness" type="number" min="0.1" step="0.1"><label class="check"><input id="auto" type="checkbox"> Tự kiểm tra cập nhật khi mở SketchUp</label><label>Kênh cập nhật</label><select id="channel"><option value="stable">Ổn định</option><option value="test">Thử nghiệm</option></select></div>
<div class="card"><label style="margin-top:0;font-weight:bold;color:#fdba74">BẬT / TẮT TỪNG TÍNH NĂNG</label><div class="features"><label class="feature"><input id="feature_board" type="checkbox"> Vẽ Ván</label><label class="feature"><input id="feature_box" type="checkbox"> Tạo Khối BOX</label><label class="feature"><input id="feature_drawer" type="checkbox"> Vẽ Ngăn Kéo</label><label class="feature"><input id="feature_round" type="checkbox"> Bo Cong Khối</label><label class="feature"><input id="feature_grain" type="checkbox"> Xoay Vân Ván</label><label class="feature"><input id="feature_layout_stats" type="checkbox"> Xuất Layout + Thống Kê Ván</label></div></div>
<div class="buttons"><button class="primary" onclick="save()">LƯU CÀI ĐẶT</button><button class="dark" onclick="sketchup.check_update()">KIỂM TRA CẬP NHẬT</button><button class="dark" onclick="sketchup.reload()">NẠP LẠI HỆ THỐNG</button><button class="dark" onclick="window.close()">ĐÓNG</button></div><div id="notice" class="notice"></div></div>
<script>window.setSettings=d=>{version.textContent=d.version;thickness.value=d.thickness;auto.checked=d.auto_update;channel.value=d.channel;feature_board.checked=d.feature_board;feature_box.checked=d.feature_box;feature_drawer.checked=d.feature_drawer;feature_round.checked=d.feature_round;feature_grain.checked=d.feature_grain;feature_layout_stats.checked=d.feature_layout_stats};window.notice=(m,k)=>{const n=document.getElementById('notice');n.textContent=m;n.className='notice '+k};function save(){sketchup.save(JSON.stringify({thickness:Number(thickness.value),auto_update:auto.checked,channel:channel.value,feature_board:feature_board.checked,feature_box:feature_box.checked,feature_drawer:feature_drawer.checked,feature_round:feature_round.checked,feature_grain:feature_grain.checked,feature_layout_stats:feature_layout_stats.checked}))}document.addEventListener('DOMContentLoaded',()=>sketchup.ready());</script></body></html>
