<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>TT - Thông tin tấm</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">TT</div>
      <div>
        <h1>TT - KIỂM TRA TẤM</h1>
        <div class="sub">Thông tin Model & tấm — xem trực tiếp trên điện thoại</div>
      </div>
    </div>
    <div id="status" class="status">Đang tải…</div>
  </header>

  <main class="wrap">
    <section id="modelCard" class="panel hero hidden">
      <div>
        <div class="eyebrow">MODEL</div>
        <h2 id="modelName">—</h2>
        <div class="meta">
          <span id="modelId">—</span>
          <span id="updatedAt">—</span>
        </div>
      </div>
      <div class="stats">
        <div><b id="panelCount">0</b><span>Tấm</span></div>
        <div><b id="edgeCount">0</b><span>Cạnh dán</span></div>
        <div><b id="thicknessCount">0</b><span>Độ dày</span></div>
      </div>
    </section>

    <section id="controls" class="panel controls hidden">
      <input id="search" type="search" placeholder="Tìm tên tấm / mã tấm / vị trí…">
      <select id="thicknessFilter"><option value="">Tất cả độ dày</option></select>
      <select id="edgeFilter">
        <option value="">Tất cả cạnh</option>
        <option value="has">Có dán cạnh</option>
        <option value="none">Không dán cạnh</option>
      </select>
    </section>

    <section id="summary" class="panel summary hidden"></section>

    <section id="list" class="cards"></section>

    <section id="errorBox" class="panel error hidden">
      <h3>Không tải được dữ liệu</h3>
      <p id="errorText"></p>
    </section>
  </main>

  <dialog id="detailDialog">
    <div class="dialogHead">
      <div>
        <div class="eyebrow">CHI TIẾT TẤM</div>
        <h3 id="dName">—</h3>
      </div>
      <button id="closeDialog" aria-label="Đóng">×</button>
    </div>
    <div id="detailBody"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
